<h2 mat-dialog-title class="xj-dialog__title">Edit profile</h2>

<mat-dialog-content class="xj-dialog__content">
  <div *ngIf="apiError" class="xj-alert xj-alert--error xj-dialog__alert" role="alert">
    <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ apiError }}</div>
  </div>

  <form [formGroup]="updateProfielForm" (ngSubmit)="handleUpdateProfile()" novalidate>
    <div class="xj-profile-form__row">
      <div class="xj-field">
        <label class="xj-label" for="profile-first">
          First name<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="profile-first" class="xj-input" formControlName="firstName" type="text" autocomplete="given-name"
               [class.is-invalid]="updateProfielForm.get('firstName')?.touched && updateProfielForm.get('firstName')?.invalid" />
        <p class="xj-field-error"
           *ngIf="updateProfielForm.get('firstName')?.touched && updateProfielForm.get('firstName')?.invalid">
          2–30 letters, no digits or spaces.
        </p>
        <p class="xj-field-error" *ngIf="validationErrors['firstName']">{{ validationErrors['firstName'] }}</p>
      </div>

      <div class="xj-field">
        <label class="xj-label" for="profile-last">
          Last name<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="profile-last" class="xj-input" formControlName="lastName" type="text" autocomplete="family-name"
               [class.is-invalid]="updateProfielForm.get('lastName')?.touched && updateProfielForm.get('lastName')?.invalid" />
        <p class="xj-field-error"
           *ngIf="updateProfielForm.get('lastName')?.touched && updateProfielForm.get('lastName')?.invalid">
          2–30 letters, no digits or spaces.
        </p>
        <p class="xj-field-error" *ngIf="validationErrors['lastName']">{{ validationErrors['lastName'] }}</p>
      </div>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="profile-email">
        Email<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <input id="profile-email" class="xj-input" formControlName="email" type="email" autocomplete="email"
             [class.is-invalid]="updateProfielForm.get('email')?.touched && updateProfielForm.get('email')?.invalid" />
      <p class="xj-field-error"
         *ngIf="updateProfielForm.get('email')?.touched && updateProfielForm.get('email')?.invalid">
        Enter a valid email address.
      </p>
      <p class="xj-field-error" *ngIf="validationErrors['email']">{{ validationErrors['email'] }}</p>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="profile-school">School</label>
      <input id="profile-school" class="xj-input" formControlName="school" type="text"
             placeholder="Optional" autocomplete="organization" />
      <p class="xj-field-error" *ngIf="validationErrors['school']">{{ validationErrors['school'] }}</p>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="xj-dialog__actions">
  <button type="button" class="xj-btn xj-btn--secondary" mat-dialog-close>Cancel</button>
  <button type="button" class="xj-btn xj-btn--primary" [disabled]="isLoading" (click)="handleUpdateProfile()">
    <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
    {{ isLoading ? 'Saving…' : 'Save changes' }}
  </button>
</mat-dialog-actions>
