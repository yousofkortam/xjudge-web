<div class="xj-auth">
  <div class="xj-auth__card xj-card">
    <h1 class="xj-auth__title">Forgot your password?</h1>
    <p class="xj-auth__subtitle">
      Enter the email address on your account and we will send you a reset link.
    </p>

    <div *ngIf="successMessage" class="xj-alert xj-alert--success xj-auth__alert" role="status">
      <i class="fa fa-envelope-circle-check xj-alert__icon" aria-hidden="true"></i>
      <div class="xj-alert__body">{{ successMessage }}</div>
    </div>

    <div *ngIf="apiError" class="xj-alert xj-alert--error xj-auth__alert" role="alert">
      <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
      <div class="xj-alert__body">{{ apiError }}</div>
    </div>

    <form [formGroup]="forgetPasswordForm" (ngSubmit)="handleForgetPassword(forgetPasswordForm)" novalidate>
      <div class="xj-field">
        <label class="xj-label" for="email">
          Email<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="email" class="xj-input" formControlName="email" type="email" autocomplete="email"
               [class.is-invalid]="forgetPasswordForm.get('email')?.touched && forgetPasswordForm.get('email')?.invalid" />
        <p class="xj-field-error"
           *ngIf="forgetPasswordForm.get('email')?.touched && forgetPasswordForm.get('email')?.invalid">
          Enter the email address you registered with.
        </p>
        <p class="xj-field-error" *ngIf="validationErrors['email']">{{ validationErrors['email'] }}</p>
      </div>

      <button type="submit" class="xj-btn xj-btn--primary xj-btn--lg xj-btn--block" [disabled]="isLoading">
        <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
        {{ isLoading ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>

    <div class="xj-auth__links">
      <a routerLink="/login">Back to sign in</a>
    </div>
  </div>
</div>
