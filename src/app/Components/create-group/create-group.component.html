<h2 mat-dialog-title class="xj-dialog__title">{{ isEdit ? 'Edit group' : 'Create a group' }}</h2>

<mat-dialog-content class="xj-dialog__content">
  <div *ngIf="apiError" class="xj-alert xj-alert--error xj-dialog__alert" role="alert">
    <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ apiError }}</div>
  </div>

  <form [formGroup]="createGroupForm" (ngSubmit)="handleSubmitGroup()" novalidate>
    <div class="xj-field">
      <label class="xj-label" for="group-name">
        Name<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <input id="group-name" class="xj-input" formControlName="name" type="text"
             placeholder="e.g. ICPC Training"
             [class.is-invalid]="createGroupForm.get('name')?.touched && createGroupForm.get('name')?.invalid" />
      <p class="xj-field-error"
         *ngIf="createGroupForm.get('name')?.touched && createGroupForm.get('name')?.invalid">
        A name of at most 60 characters is required.
      </p>
      <p class="xj-field-error" *ngIf="validationErrors['name']">{{ validationErrors['name'] }}</p>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="group-description">
        Description<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <textarea id="group-description" class="xj-textarea" formControlName="description"
                rows="3" placeholder="What is this group for?"
                [class.is-invalid]="createGroupForm.get('description')?.touched && createGroupForm.get('description')?.invalid"></textarea>
      <p class="xj-field-error"
         *ngIf="createGroupForm.get('description')?.touched && createGroupForm.get('description')?.invalid">
        A description of at most 500 characters is required.
      </p>
      <p class="xj-field-error" *ngIf="validationErrors['description']">{{ validationErrors['description'] }}</p>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="group-visibility">Visibility</label>
      <select id="group-visibility" class="xj-select" formControlName="visibility">
        <option value="PUBLIC">Public — anyone can find and join</option>
        <option value="PRIVATE">Private — members join by invitation</option>
      </select>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="xj-dialog__actions">
  <button type="button" class="xj-btn xj-btn--secondary" mat-dialog-close>Cancel</button>
  <button type="button" class="xj-btn xj-btn--primary" [disabled]="isLoading" (click)="handleSubmitGroup()">
    <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
    {{ isLoading ? 'Saving…' : (isEdit ? 'Save changes' : 'Create group') }}
  </button>
</mat-dialog-actions>
