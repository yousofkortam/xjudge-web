<div class="xj-grid xj-grid--cards">
  <article class="xj-card xj-card--interactive xj-group-card"
           *ngFor="let group of groups; trackBy: trackByGroup">
    <div class="xj-group-card__head">
      <h3 class="xj-group-card__title">
        <a [routerLink]="['/group', group.id]">{{ group.name }}</a>
      </h3>
      <span class="xj-badge" [ngClass]="roleClass(group.userGroupRole)" *ngIf="group.userGroupRole">
        {{ group.userGroupRole | titlecase }}
      </span>
    </div>

    <p class="xj-group-card__desc">{{ group.description || 'No description.' }}</p>

    <div class="xj-group-card__foot">
      <span class="xj-muted">
        <i class="fa fa-users" aria-hidden="true"></i>
        {{ group.members ?? 0 }} {{ group.members === 1 ? 'member' : 'members' }}
      </span>
      <span class="xj-badge xj-badge--neutral" *ngIf="group.visibility">{{ group.visibility | titlecase }}</span>
    </div>
  </article>
</div>
