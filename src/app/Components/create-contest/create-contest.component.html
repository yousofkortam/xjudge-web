<h2 mat-dialog-title class="xj-dialog__title">Create a contest</h2>

<mat-dialog-content class="xj-dialog__content">
  <div *ngIf="apiError" class="xj-alert xj-alert--error xj-dialog__alert" role="alert">
    <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ apiError }}</div>
  </div>

  <form [formGroup]="createContestForm" (ngSubmit)="handleCreateContest()" novalidate>
    <div class="xj-field">
      <label class="xj-label" for="cc-title">
        Title<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <input id="cc-title" class="xj-input" formControlName="title" type="text"
             placeholder="e.g. Friday Practice #12"
             [class.is-invalid]="createContestForm.get('title')?.touched && createContestForm.get('title')?.invalid" />
      <p class="xj-field-error"
         *ngIf="createContestForm.get('title')?.touched && createContestForm.get('title')?.invalid">
        A title is required.
      </p>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="cc-description">
        Description<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <textarea id="cc-description" class="xj-textarea" formControlName="description" rows="2"
                placeholder="What is this contest about?"
                [class.is-invalid]="createContestForm.get('description')?.touched && createContestForm.get('description')?.invalid"></textarea>
      <p class="xj-field-error"
         *ngIf="createContestForm.get('description')?.touched && createContestForm.get('description')?.invalid">
        A description is required.
      </p>
    </div>

    <div class="xj-cc__row">
      <div class="xj-field">
        <label class="xj-label" for="cc-begin">
          Starts at<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="cc-begin" class="xj-input" formControlName="beginTime" type="datetime-local"
               [class.is-invalid]="createContestForm.get('beginTime')?.touched && createContestForm.get('beginTime')?.invalid" />
        <p class="xj-field-error"
           *ngIf="createContestForm.get('beginTime')?.touched && createContestForm.get('beginTime')?.invalid">
          Choose when the contest begins.
        </p>
      </div>

      <div class="xj-field">
        <label class="xj-label" for="cc-duration">
          Length (minutes)<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="cc-duration" class="xj-input" formControlName="durationSeconds" type="number" min="1"
               [class.is-invalid]="createContestForm.get('durationSeconds')?.touched && createContestForm.get('durationSeconds')?.invalid" />
        <p class="xj-field-error"
           *ngIf="createContestForm.get('durationSeconds')?.touched && createContestForm.get('durationSeconds')?.invalid">
          Enter a length of at least one minute.
        </p>
      </div>
    </div>

    <div class="xj-cc__row">
      <fieldset class="xj-field">
        <legend class="xj-label">Type</legend>
        <div class="xj-toggle" role="group" aria-label="Contest type">
          <button type="button" class="xj-toggle__btn"
                  [class.is-active]="!isGroupSelected"
                  [attr.aria-pressed]="!isGroupSelected"
                  [disabled]="isGroupSelectorDisabled"
                  (click)="onClassicClick()">Classical</button>
          <button type="button" class="xj-toggle__btn"
                  [class.is-active]="isGroupSelected"
                  [attr.aria-pressed]="isGroupSelected"
                  (click)="onGroupClick()">Group</button>
        </div>
      </fieldset>

      <div class="xj-field">
        <label class="xj-label" for="cc-visibility">Visibility</label>
        <select id="cc-visibility" class="xj-select" formControlName="visibility">
          <option value="PUBLIC">Public</option>
          <option value="PRIVATE">Private — password required</option>
        </select>
      </div>
    </div>

    <div class="xj-field" *ngIf="isGroupSelected && !isGroupSelectorDisabled">
      <label class="xj-label" for="cc-group">
        Group<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <select id="cc-group" class="xj-select" formControlName="groupId">
        <option [ngValue]="0">Select a group…</option>
        <option *ngFor="let group of userGroups" [ngValue]="group.id">{{ group.name }}</option>
      </select>
      <p class="xj-field-error" *ngIf="createContestForm.hasError('GroupRequired')">
        Pick one of the groups you lead.
      </p>
    </div>

    <div class="xj-field" *ngIf="isPrivate">
      <label class="xj-label" for="cc-password">Contest password</label>
      <input id="cc-password" class="xj-input" formControlName="password" type="text"
             autocomplete="off" placeholder="Shared with participants" />
    </div>

    <fieldset class="xj-cc__problems">
      <legend class="xj-label">Problems</legend>

      <div class="xj-cc__problem" *ngFor="let problem of getFormProblems(); let i = index; trackBy: trackByIndex"
           [formGroup]="$any(problem)">
        <span class="xj-cc__problem-tag" aria-hidden="true">{{ getLetter(i) }}</span>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'problem-oj-' + i">Judge for problem {{ getLetter(i) }}</label>
          <select [id]="'problem-oj-' + i" class="xj-select" formControlName="ojType">
            <option value="">Judge…</option>
            <option *ngFor="let judge of onlineJudges" [value]="judge">{{ judge }}</option>
          </select>
        </div>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'problem-code-' + i">Code for problem {{ getLetter(i) }}</label>
          <input [id]="'problem-code-' + i" class="xj-input" formControlName="code" type="text" placeholder="Code, e.g. 1850A" />
        </div>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'problem-alias-' + i">Display name for problem {{ getLetter(i) }}</label>
          <input [id]="'problem-alias-' + i" class="xj-input" formControlName="problemAlias" type="text" placeholder="Display name" />
        </div>

        <div class="xj-field xj-cc__weight">
          <label class="xj-sr-only" [attr.for]="'problem-weight-' + i">Weight for problem {{ getLetter(i) }}</label>
          <input [id]="'problem-weight-' + i" class="xj-input" formControlName="problemWeight" type="number" min="1" placeholder="Weight" />
        </div>

        <button type="button" class="xj-btn xj-btn--ghost xj-btn--sm xj-cc__remove"
                [disabled]="!canDeleteProblem"
                (click)="removeProblemForm(i)"
                [attr.aria-label]="'Remove problem ' + getLetter(i)">
          <i class="fa fa-trash" aria-hidden="true"></i>
        </button>
      </div>

      <button type="button" class="xj-btn xj-btn--secondary xj-btn--sm" (click)="addNewProblemForm()">
        <i class="fa fa-plus" aria-hidden="true"></i> Add problem
      </button>
    </fieldset>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="xj-dialog__actions">
  <button type="button" class="xj-btn xj-btn--secondary" mat-dialog-close>Cancel</button>
  <button type="button" class="xj-btn xj-btn--primary" [disabled]="isLoading" (click)="handleCreateContest()">
    <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
    {{ isLoading ? 'Creating…' : 'Create contest' }}
  </button>
</mat-dialog-actions>
