<h2 mat-dialog-title class="xj-dialog__title">Edit contest</h2>

<mat-dialog-content class="xj-dialog__content">
  <div *ngIf="apiError" class="xj-alert xj-alert--error xj-dialog__alert" role="alert">
    <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ apiError }}</div>
  </div>

  <form *ngIf="ready" [formGroup]="updateContestForm" (ngSubmit)="handleUpdateContest()" novalidate>
    <div class="xj-field">
      <label class="xj-label" for="uc-title">
        Title<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <input id="uc-title" class="xj-input" formControlName="title" type="text"
             [class.is-invalid]="updateContestForm.get('title')?.touched && updateContestForm.get('title')?.invalid" />
      <p class="xj-field-error"
         *ngIf="updateContestForm.get('title')?.touched && updateContestForm.get('title')?.invalid">
        A title is required.
      </p>
    </div>

    <div class="xj-field">
      <label class="xj-label" for="uc-description">
        Description<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <textarea id="uc-description" class="xj-textarea" formControlName="description" rows="2"
                [class.is-invalid]="updateContestForm.get('description')?.touched && updateContestForm.get('description')?.invalid"></textarea>
      <p class="xj-field-error"
         *ngIf="updateContestForm.get('description')?.touched && updateContestForm.get('description')?.invalid">
        A description is required.
      </p>
    </div>

    <div class="xj-cc__row">
      <div class="xj-field">
        <label class="xj-label" for="uc-begin">
          Starts at<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="uc-begin" class="xj-input" formControlName="beginTime" type="datetime-local"
               [class.is-invalid]="updateContestForm.get('beginTime')?.touched && updateContestForm.get('beginTime')?.invalid" />
      </div>

      <div class="xj-field">
        <label class="xj-label" for="uc-duration">
          Length (minutes)<span class="xj-label__required" aria-hidden="true">*</span>
        </label>
        <input id="uc-duration" class="xj-input" formControlName="durationSeconds" type="number" min="1"
               [class.is-invalid]="updateContestForm.get('durationSeconds')?.touched && updateContestForm.get('durationSeconds')?.invalid" />
      </div>
    </div>

    <div class="xj-cc__row">
      <fieldset class="xj-field">
        <legend class="xj-label">Type</legend>
        <div class="xj-toggle" role="group" aria-label="Contest type">
          <button type="button" class="xj-toggle__btn"
                  [class.is-active]="!isGroupSelected" [attr.aria-pressed]="!isGroupSelected"
                  (click)="onClassicClick()">Classical</button>
          <button type="button" class="xj-toggle__btn"
                  [class.is-active]="isGroupSelected" [attr.aria-pressed]="isGroupSelected"
                  (click)="onGroupClick()">Group</button>
        </div>
      </fieldset>

      <div class="xj-field">
        <label class="xj-label" for="uc-visibility">Visibility</label>
        <select id="uc-visibility" class="xj-select" formControlName="visibility">
          <option value="PUBLIC">Public</option>
          <option value="PRIVATE">Private — password required</option>
        </select>
      </div>
    </div>

    <div class="xj-field" *ngIf="isPrivate">
      <label class="xj-label" for="uc-password">Contest password</label>
      <input id="uc-password" class="xj-input" formControlName="password" type="text" autocomplete="off" />
    </div>

    <fieldset class="xj-cc__problems">
      <legend class="xj-label">Problems</legend>

      <div class="xj-cc__problem" *ngFor="let problem of getFormProblems(); let i = index; trackBy: trackByIndex"
           [formGroup]="$any(problem)">
        <span class="xj-cc__problem-tag" aria-hidden="true">{{ getLetter(i) }}</span>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'uc-oj-' + i">Judge for problem {{ getLetter(i) }}</label>
          <select [id]="'uc-oj-' + i" class="xj-select" formControlName="ojType">
            <option value="">Judge…</option>
            <option *ngFor="let judge of onlineJudges" [value]="judge">{{ judge }}</option>
          </select>
        </div>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'uc-code-' + i">Code for problem {{ getLetter(i) }}</label>
          <input [id]="'uc-code-' + i" class="xj-input" formControlName="code" type="text" placeholder="Code" />
        </div>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'uc-alias-' + i">Display name for problem {{ getLetter(i) }}</label>
          <input [id]="'uc-alias-' + i" class="xj-input" formControlName="problemAlias" type="text" placeholder="Display name" />
        </div>

        <div class="xj-field">
          <label class="xj-sr-only" [attr.for]="'uc-weight-' + i">Weight for problem {{ getLetter(i) }}</label>
          <input [id]="'uc-weight-' + i" class="xj-input" formControlName="problemWeight" type="number" min="1" placeholder="Weight" />
        </div>

        <button type="button" class="xj-btn xj-btn--ghost xj-btn--sm xj-cc__remove"
                [disabled]="!canDeleteProblem" (click)="removeProblemForm(i)"
                [attr.aria-label]="'Remove problem ' + getLetter(i)">
          <i class="fa fa-trash" aria-hidden="true"></i>
        </button>
      </div>

      <button type="button" class="xj-btn xj-btn--secondary xj-btn--sm" (click)="addNewProblemForm()">
        <i class="fa fa-plus" aria-hidden="true"></i> Add problem
      </button>
    </fieldset>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="xj-dialog__actions">
  <button type="button" class="xj-btn xj-btn--secondary" mat-dialog-close>Cancel</button>
  <button type="button" class="xj-btn xj-btn--primary" [disabled]="isLoading || !ready" (click)="handleUpdateContest()">
    <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
    {{ isLoading ? 'Saving…' : 'Save changes' }}
  </button>
</mat-dialog-actions>
