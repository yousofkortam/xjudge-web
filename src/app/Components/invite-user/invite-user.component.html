<h2 mat-dialog-title class="xj-dialog__title">Invite a user</h2>

<mat-dialog-content class="xj-dialog__content">
  <div *ngIf="successMessage" class="xj-alert xj-alert--success xj-dialog__alert" role="status">
    <i class="fa fa-circle-check xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ successMessage }}</div>
  </div>

  <div *ngIf="apiError" class="xj-alert xj-alert--error xj-dialog__alert" role="alert">
    <i class="fa fa-circle-exclamation xj-alert__icon" aria-hidden="true"></i>
    <div class="xj-alert__body">{{ apiError }}</div>
  </div>

  <form [formGroup]="inviteUserForm" (ngSubmit)="handleInviteUser()" novalidate>
    <div class="xj-field">
      <label class="xj-label" for="invite-handle">
        Handle<span class="xj-label__required" aria-hidden="true">*</span>
      </label>
      <input id="invite-handle" class="xj-input" formControlName="handle" type="text"
             placeholder="Their X-Judge handle" autocapitalize="none" spellcheck="false"
             [class.is-invalid]="inviteUserForm.get('handle')?.touched && inviteUserForm.get('handle')?.invalid" />
      <p class="xj-hint">They will find the invitation under Groups → Invitations.</p>
      <p class="xj-field-error"
         *ngIf="inviteUserForm.get('handle')?.touched && inviteUserForm.get('handle')?.invalid">
        Enter the handle of the user you want to invite.
      </p>
      <p class="xj-field-error" *ngIf="validationErrors['receiverHandle']">{{ validationErrors['receiverHandle'] }}</p>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="xj-dialog__actions">
  <button type="button" class="xj-btn xj-btn--secondary" (click)="close()">Done</button>
  <button type="button" class="xj-btn xj-btn--primary" [disabled]="isLoading" (click)="handleInviteUser()">
    <span *ngIf="isLoading" class="xj-spinner xj-spinner--sm" aria-hidden="true"></span>
    {{ isLoading ? 'Sending…' : 'Send invitation' }}
  </button>
</mat-dialog-actions>
