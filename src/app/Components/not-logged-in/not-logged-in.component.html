<div class="xj-state">
  <i class="fa fa-lock xj-state__icon" aria-hidden="true"></i>
  <h2 class="xj-state__title">Sign in required</h2>
  <p class="xj-state__text">{{ message }}</p>
  <div class="xj-row xj-notlogged__actions">
    <a class="xj-btn xj-btn--primary"
       [routerLink]="['/login']"
       [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}">Sign in</a>
    <a class="xj-btn xj-btn--secondary" routerLink="/register">Create account</a>
  </div>
</div>
