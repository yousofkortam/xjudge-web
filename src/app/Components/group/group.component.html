<div class="xj-page">
  <header class="xj-page-header">
    <div>
      <h1 class="xj-page-header__title">Groups</h1>
      <p class="xj-page-header__subtitle">Train together, share contests, and track a team's progress.</p>
    </div>
    <div class="xj-page-header__actions">
      <button type="button" class="xj-btn xj-btn--primary" (click)="openCreateGroupForm()">
        <i class="fa fa-plus" aria-hidden="true"></i> Create group
      </button>
    </div>
  </header>

  <!-- Tabs are real links so the URL and the visible tab can never disagree,
       and the child routes render through the outlet below. -->
  <nav class="xj-tabs" aria-label="Group sections">
    <a *ngFor="let tab of visibleTabs"
       class="xj-tab"
       [routerLink]="['/group', tab.path]"
       routerLinkActive="is-active"
       #rla="routerLinkActive"
       [attr.aria-current]="rla.isActive ? 'page' : null">{{ tab.label }}</a>
  </nav>

  <router-outlet></router-outlet>
</div>
